name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Baixa os arquivos do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # Instala o Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Instala as dependências do projeto
      - name: Install dependencies
        run: npm ci

      # Compila o React/Vite
      - name: Build
        run: npm run build

      # Prepara o GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Envia a pasta compilada para publicação
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      # Publica efetivamente no GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
